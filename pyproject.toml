[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localmcptools"
version = "0.1.0"
description = "Local MCP toolset for VS Code agents (codebuddy, GitHub Copilot, workbuddy, minimax code)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "LocalMcpTools Contributors" },
]
keywords = ["mcp", "model-context-protocol", "agent", "vscode", "codebuddy", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Runtime dependencies — locked by the bootstrap-mcp-server spike. See
# openspec/changes/bootstrap-mcp-server/design.md for the import paths
# verified against this version. Bumps must come with a re-run of the
# integration suite and a design.md note.
dependencies = [
    "mcp==1.29.0",
    "pydantic>=2.9,<3",
    "psutil>=6.0,<7",
    "pywin32>=306; sys_platform == 'win32'",
    # change-5 (angular-ui-foundation): HTTP control plane + UI mount.
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    # change-6 (ui-automation-and-ocr): UIA + screenshots + OCR.
    "uiautomation>=2.0,<3",
    "Pillow>=10.0,<12",
    # winsdk is the Windows OCR provider. Optional because the spike
    # runs without it; the package falls back to a stub provider
    # that emits ``uncertain=True`` results.
    "winsdk>=1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-psutil>=6.0,<8",
]

[project.scripts]
localmcptools = "localmcptools.cli:main"

[project.urls]
Repository = "https://github.com/Jzhong2026/LocalMcpTools"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["localmcptools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    # e2e suite is opt-in: `pytest -m e2e` runs it.
    # Default `pytest` skips it so dev cycles stay fast.
    "-m",
    "not e2e",
]
markers = [
    "e2e: end-to-end suite (spawns a real server process)",
    "e2e_slow: > 60s e2e test",
    "e2e_manual: needs user / reboot",
    "e2e_admin: needs admin shell",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length (formatter handles)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
# Tests import the local package by name; point mypy at the source
# tree so it can analyse (and type-check) the package modules rather
# than treating them as opaque third-party imports.
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mcp.*", "chardet", "win32api", "win32con", "win32job", "pywintypes"]
ignore_missing_imports = true

# Test code is allowed to be looser than production code:
#   * disallow_untyped_defs  — fixtures and parametrised cases don't
#                              always carry full annotations.
#   * attr-defined           — tests poke at module-level helpers via
#                              ``monkeypatch.setattr`` and the patched
#                              binding isn't visible to mypy.
#   * call-arg               — some tests DELIBERATELY pass invalid
#                              kwargs to verify Pydantic models reject
#                              them (see test_envelope.py::*_forbids_*).
# Real type bugs (Any | None indexing, dict invariance, generator
# return types) still surface and must be fixed individually.
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = [
    "attr-defined",
    "call-arg",
    "no-untyped-def",
]
